name: CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: "Lint, build and test"
    runs-on: ubuntu-latest
    steps:

    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
        cache: true

    - name: Vet
      run: make vet

    - name: Test
      run: make test

    - name: Lint
      run: make lint

  changes:
    name: "Detect changed modules"
    runs-on: ubuntu-latest
    outputs:
      alert-job: ${{ steps.filter.outputs.alert-job }}
      web: ${{ steps.filter.outputs.web }}
    steps:

    - name: Checkout the code
      uses: actions/checkout@v6

    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          shared: &shared
            - 'internal/**'
            - 'go.mod'
            - 'go.sum'
          alert-job:
            - *shared
            - 'alert-job/**'
          web:
            - *shared
            - 'web/**'

  alert-job:
    name: "Deploy alert-job"
    needs: [test, changes]
    if: needs.changes.outputs.alert-job == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_lambda-pipeline.yml
    with:
      module-dir: alert-job
      image-name: wind-alert
      function-name: wind-alert
      role-arn: arn:aws:iam::513532022998:role/wind-alert
    secrets: inherit

  web:
    name: "Deploy web"
    needs: [test, changes]
    if: needs.changes.outputs.web == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_lambda-pipeline.yml
    with:
      module-dir: web
      image-name: wind-alert-web
      function-name: wind-alert-web
      role-arn: arn:aws:iam::513532022998:role/wind-alert-web
    secrets: inherit
