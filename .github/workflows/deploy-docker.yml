name: Build docker image and publish to lambda

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: "Lint, build and test"
    runs-on: ubuntu-latest
    steps:

    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26
        cache: true

    - name: Run lint and tests
      run: |
        make lint
        make build
        make test

  build-and-push:
    name: "Build and push Docker image"
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:

    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4.3.1
      with:
        aws-region: eu-central-1
        role-to-assume: arn:aws:iam::513532022998:role/gh-actions-role
        role-session-name: gh-actions-session

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker Image
      id: build-image
      env:
        IMAGE_TAG: "513532022998.dkr.ecr.eu-central-1.amazonaws.com/wind-alert:latest"
      run: |
        docker buildx build --platform linux/amd64 --provenance=false -t ${IMAGE_TAG} .
        docker push ${IMAGE_TAG}
        echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: "Deploy to AWS Lambda"
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4.3.1
      with:
        aws-region: eu-central-1
        role-to-assume: arn:aws:iam::513532022998:role/gh-actions-role
        role-session-name: gh-actions-session

    - name: Deploy Lambda function with container image
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: wind-alert
        package-type: Image
        image-uri: ${{ needs.build-and-push.outputs.image }}
        role: arn:aws:iam::513532022998:role/wind-alert
