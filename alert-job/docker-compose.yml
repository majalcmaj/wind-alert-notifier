services:
  dynamodb-local:
    extends:
      file: ../shared/dynamo.yml
      service: dynamodb-local
  dynamo-setup:
    extends:
      file: ../shared/dynamo.yml
      service: dynamo-setup
  wind-alert:
    build:
      context: ..
      dockerfile: alert-job/Dockerfile
    depends_on:
      - dynamodb-local
    ports:
      - "9000:8080"
    entrypoint: ["/usr/local/bin/aws-lambda-rie", "./main"]
    env_file: .env
    environment:
      - LOCAL_MODE=true
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=eu-central-1
