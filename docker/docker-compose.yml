services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "9100:8000"
  dynamo-setup:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-central-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/bash", "/scripts/create-tables.sh"]
  alert-job:
    build:
      context: ..
      dockerfile: docker/lambda.Dockerfile
      args:
        binary: bin/wind-alert-job/bootstrap
    depends_on:
      - dynamodb-local
    entrypoint: ["/usr/local/bin/aws-lambda-rie", "./main"]
    ports:
      - "9090:8080"
    env_file: .job-env
    environment:
      - LOCAL_MODE=true
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=eu-central-1
  web:
    build:
      context: ..
      dockerfile: docker/lambda.Dockerfile
      args:
        binary: bin/wind-alert-web/bootstrap
    depends_on:
      - dynamodb-local
    entrypoint: ["/usr/local/bin/aws-lambda-rie", "./main"]
    ports:
      - "9081:8080"
    env_file:
      - .web-env
  rie-proxy:
    build:
      context: ..
      dockerfile: docker/rie-proxy.Dockerfile
    depends_on:
      - web
    environment:
      LAMBDA_RIE_URL: http://web:8080/2015-03-31/functions/function/invocations
    ports:
      - "9080:8080"
